# Cross-file references are resolved against explicitly imported files.
import "defaults.conf"

[server]
# Reuse values defined in defaults.conf (stem-qualified references).
listen_port: int defaults.server.port
enabled: bool defaults.server.enabled
# Interpolation works with cross-file references as well.
url: "http://${defaults.server.host}:${defaults.server.port}/api"

[paths]
# Same-section, single-segment reference.
data_dir: defaults.paths.data
cache_dir: "${data_dir}/cache"
