[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "conf-lsp"
version = "0.1.0"
description = "Local Language Server for a simple configuration language (stdio JSON-RPC)"
requires-python = ">=3.10"

[project.scripts]
conf-language-server = "conf_lsp.server:main"

[tool.setuptools]
packages = ["conf_lsp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
